<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marcação de Férias</title>
  <link rel="stylesheet" href="styles/ferias.css" />
</head>
<body>
  <div class="ferias-dashboard-layout">
    <!-- Sidebar -->
    <nav class="sidebar">
      <h2>Menu</h2>
      <ul>
        <li><a href="dashboard.php">Dashboard</a></li>
        <li><a href="ferias.html" class="active">Pedido de férias</a></li>
        <li><a href="funcionarios.php">Gestão de funcionários</a></li>
        <li><a href="permissoes.php">Gestão de permissões</a></li>
        <li><a href="relatorios.html">Relatórios</a></li>
      </ul>
    </nav>
    <!-- Main Content -->
    <main class="ferias-main-content">
      <header class="ferias-header-bar">Marcação de férias</header>
      <div class="ferias-content">

        <div class="calendar-placeholder" id="calendar-root"></div>
        <div id="selected-days" style="margin-top:12px;color:#333;font-size:14px;"></div>
        <label for="tipo-ferias" style="margin-top:10px;display:block;">Tipo de férias:</label>
        <select id="tipo-ferias" style="margin-bottom:10px;">
          <option value="normal">Normal</option>
          <option value="extra">Extra</option>
        </select>
        <label for="funcionario-select" style="margin-top:10px;display:block;">Funcionário:</label>
        <select id="funcionario-select" style="margin-bottom:10px;">
          <option value="">A carregar funcionários...</option>
        </select>
        <button id="submit-ferias">Enviar pedido de férias</button>
        <div id="ferias-message"></div>
      </div>
    </main>
  </div>
  <script>
    // Calendar rendering - visually matches the CSS grid but is functional
    // Portuguese months and days
    const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
    const daysShort = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
    // State
    let currentMonthOffset = 0;
    window.selectedDays = [];

    function renderCalendar(monthOffset = 0) {
      const root = document.getElementById('calendar-root');
      root.innerHTML = '';

      const today = new Date();
      let year = today.getFullYear();
      let month = today.getMonth() + monthOffset;

      // Adjust year if month offset is out of bounds
      while (month > 11) { month -= 12; year++; }
      while (month < 0)  { month += 12; year--; }

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startDayOfWeek = firstDay.getDay();

      // Header (matches the dashboard bar style)
      const header = document.createElement('div');
      header.style.display = 'flex';
      header.style.justifyContent = 'center';
      header.style.alignItems = 'center';
      header.style.marginBottom = '6px';
      header.style.width = '100%';

      const prevBtn = document.createElement('button');
      prevBtn.textContent = '<';
      prevBtn.style.background = '#ecebdd';
      prevBtn.style.border = 'none';
      prevBtn.style.fontSize = '18px';
      prevBtn.style.cursor = 'pointer';
      prevBtn.style.marginRight = '18px';
      prevBtn.style.borderRadius = '7px';
      prevBtn.onclick = () => {
        currentMonthOffset--;
        renderCalendar(currentMonthOffset);
      };

      const nextBtn = document.createElement('button');
      nextBtn.textContent = '>';
      nextBtn.style.background = '#ecebdd';
      nextBtn.style.border = 'none';
      nextBtn.style.fontSize = '18px';
      nextBtn.style.cursor = 'pointer';
      nextBtn.style.marginLeft = '18px';
      nextBtn.style.borderRadius = '7px';
      nextBtn.onclick = () => {
        currentMonthOffset++;
        renderCalendar(currentMonthOffset);
      };

      const title = document.createElement('span');
      title.textContent = months[month] + ' ' + year;
      title.style.fontWeight = 'bold';
      title.style.fontSize = '20px';
      title.style.flex = 'none';

      header.appendChild(prevBtn);
      header.appendChild(title);
      header.appendChild(nextBtn);

      root.appendChild(header);

      // Day names row
      const daysRow = document.createElement('div');
      daysRow.className = 'ferias-calendar-grid days';
      daysShort.forEach(day => {
        const cell = document.createElement('div');
        cell.className = 'ferias-calendar-cell day-label';
        cell.textContent = day;
        daysRow.appendChild(cell);
      });
      root.appendChild(daysRow);

      // Days grid
      const grid = document.createElement('div');
      grid.className = 'ferias-calendar-grid';

      // Fill empty slots before first day
      for (let i = 0; i < startDayOfWeek; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'ferias-calendar-cell empty';
        grid.appendChild(emptyCell);
      }

      // Fill days
      for (let date = 1; date <= daysInMonth; date++) {
        const cell = document.createElement('div');
        cell.className = 'ferias-calendar-cell day';
        cell.textContent = date;
        const key = `${year}-${month + 1}-${date}`;
        if (window.selectedDays.includes(key)) {
          cell.classList.add('selected');
        }
        cell.onclick = function () {
          const idx = window.selectedDays.indexOf(key);
          if (idx === -1) {
            window.selectedDays.push(key);
          } else {
            window.selectedDays.splice(idx, 1);
          }
          renderCalendar(currentMonthOffset);
          showSelectedDays();
        };
        grid.appendChild(cell);
      }

      // Fill remaining slots to make full 5 rows of 7 (if needed)
      let totalCells = startDayOfWeek + daysInMonth;
      while (totalCells % 7 !== 0) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'ferias-calendar-cell empty';
        grid.appendChild(emptyCell);
        totalCells++;
      }

      root.appendChild(grid);
    }

    function showSelectedDays() {
      const sel = document.getElementById('selected-days');
      if (!window.selectedDays || window.selectedDays.length === 0) {
        sel.textContent = "Nenhum dia selecionado.";
      } else {
        sel.textContent = "Dias marcados para férias: " + window.selectedDays.join(', ');
      }
    }

    function getDateRange(dates) {
      if (!dates.length) return {inicio: null, fim: null};
      // Sort dates
      const sorted = dates.slice().sort();
      return {inicio: sorted[0], fim: sorted[sorted.length - 1]};
    }

    document.addEventListener('DOMContentLoaded', function() {
      renderCalendar(0);
      showSelectedDays();

      document.getElementById('submit-ferias').onclick = function() {
        if (!window.selectedDays || window.selectedDays.length === 0) {
          document.getElementById('ferias-message').textContent = "Selecione pelo menos um dia para marcar férias.";
          return;
        }
        const tipo = document.getElementById('tipo-ferias').value;
        const funcionario_id = document.getElementById('funcionario-select').value;
        const {inicio, fim} = getDateRange(window.selectedDays);
        fetch('scripts/adicionar_pedido_ferias.php', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ id_funcionario: funcionario_id, data_inicio: inicio, data_fim: fim, tipo })
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            document.getElementById('ferias-message').textContent = "Pedido de férias enviado com sucesso!";
            window.selectedDays = [];
            renderCalendar(currentMonthOffset);
            showSelectedDays();
          } else {
            document.getElementById('ferias-message').textContent = "Erro ao enviar pedido: " + (data.error || "Tente novamente.");
          }
        })
        .catch(() => {
          document.getElementById('ferias-message').textContent = "Erro de comunicação com o servidor.";
        });
      };
    });
  </script>
  <script src="scripts/funcionariosDropdown.js"></script>
</body>
</html>
